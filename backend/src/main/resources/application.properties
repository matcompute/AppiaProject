## Appia Backend — Application Properties

spring.application.name=appia-backend
server.port=8080

# ── Database (H2 embedded for dev — swap to PostgreSQL for prod) ─────────────
spring.datasource.url=jdbc:h2:mem:appiadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=appia
spring.datasource.password=appia
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── CORS (allow React dev server) ────────────────────────────────────────────
appia.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# ── Python AI Engine ─────────────────────────────────────────────────────────
appia.python.engine.url=http://localhost:8004

# ── Gemini AI API ─────────────────────────────────────────────────────────────
# Reads GOOGLE_API_KEY from .env file (loaded by run.bat) or environment
appia.gemini.api-key=${GOOGLE_API_KEY:missing-set-in-.env}
appia.gemini.model=gemini-2.5-flash-lite
appia.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.appia=DEBUG
logging.level.org.springframework.web=INFO
